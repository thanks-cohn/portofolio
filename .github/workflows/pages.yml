name: Deploy NUME to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate portfolio builder Python
        run: python -m py_compile tools/portfolio_builder_site.py tools/truth_csv_editor.py
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - uses: actions/configure-pages@v5
      - run: npm ci
      - name: Generate site data from truth.csv
        run: npm run truth:generate
      - run: npm run validate:catalog
      - run: npm run validate:targets
      - run: npm run build:pages
      - name: Verify static artifact
        run: test -d out && npm run validate:targets
      - uses: actions/upload-pages-artifact@v3
        with: { path: ./out }
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
